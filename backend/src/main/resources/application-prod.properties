server.port=8080
spring.application.name=stats-innotech-platform

# ===================== POSTGRESQL PRODUCTION DATASOURCE =====================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:statsinnotech_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===================== JPA / HIBERNATE =====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===================== JWT CONFIGURATION =====================
stats.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
stats.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== CORS =====================
stats.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://statsinnotech.in}
