server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=stats-innotech-platform

# ===================== DATASOURCE (PostgreSQL) =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:stats-db.cn08m0auy8ik.eu-north-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:statsinnotech_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Sujal@123}

# ===================== JPA / HIBERNATE =====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== JWT CONFIGURATION =====================
spring.jackson.serialization.fail-on-empty-beans=false
stats.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
stats.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== CORS =====================
stats.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://statsinnotech.in}

# ===================== DOCUMENT STORAGE PATHS =====================
stats.storage.documents-dir=./data/documents
stats.storage.uploads-dir=./data/uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================== EMAIL CONFIGURATION =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=support@statsinnotech.in
spring.mail.password=statsinnotechpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
